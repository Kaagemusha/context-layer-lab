name: Snapshot age advisory

on:
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: age
        shell: bash
        run: |
          if node scripts/check-snapshot-age.mjs; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Refresh the pinned Context Layer Lab sample"
          if ! gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create \
              --title "$title" \
              --body "The monthly age check found that the pinned public sample exceeded its declared age threshold. Refresh it or explicitly retain it with a documented reason."
          fi
